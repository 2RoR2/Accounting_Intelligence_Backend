version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your untracked .env file}
      POSTGRES_DB: ${DB_NAME:-accounting_db}
    # Bind to localhost and avoid default port conflicts
    ports:
      - "127.0.0.1:5433:5432"

  redis:
    image: redis:7.2-alpine
    # Bind to localhost to prevent public exposure
    ports:
      - "127.0.0.1:6379:6379"

  worker-cpu:
    image: python:3.12-slim
    volumes:
      - .:/app
    working_dir: /app
    # Scope: Development container. Installs dependencies at runtime to match host
    # and ensures RQ uses JSON serialization.
    command: bash -c "pip install -r requirements.txt && rq worker cpu_tasks --url redis://redis:6379/0 --serializer rq.serializers.JSONSerializer --worker-class rq.worker.SimpleWorker"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?Set DB_PASSWORD in your untracked .env file}@db:5432/${DB_NAME:-accounting_db}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

