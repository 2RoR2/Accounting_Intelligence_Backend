name: Backend CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d accounting_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-rq.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Lint backend AI boundary
        run: >-
          python -m ruff check
          services/extraction/ai/text_llm.py
          tests/extraction/test_text_llm.py

      - name: Type-check backend AI boundary
        run: python -m mypy services/extraction/ai/text_llm.py --ignore-missing-imports

      - name: Run backend tests
        env:
          AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
          # Keep the shared application URL unset. PostgreSQL integration tests
          # use TEST_DATABASE_URL and create disposable databases as needed.
          DATABASE_URL: ''
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/accounting_test
          APP_ENV: test
          AI_EXTRACTION: 'off'
        run: >-
          python -m pytest
          tests/extraction/test_text_llm.py
          tests/extraction/test_extraction_lift.py
          -q -p no:cacheprovider

  deploy:
    name: Trigger Render deployment
    needs: test
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/features' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_HEALTHCHECK_URL: ${{ secrets.RENDER_HEALTHCHECK_URL }}
    steps:
      - name: Check Render healthcheck configuration
        if: ${{ env.RENDER_HEALTHCHECK_URL == '' }}
        run: |
          echo "::warning::RENDER_HEALTHCHECK_URL is not configured; deployment health verification was skipped."

      - name: Trigger Render deploy hook
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Verify Render deployment health
        if: ${{ env.RENDER_HEALTHCHECK_URL != '' }}
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 "$RENDER_HEALTHCHECK_URL" \
              | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "Render health check passed on attempt $attempt"
              exit 0
            fi
            echo "Render is not healthy yet (attempt $attempt/30)"
            sleep 10
          done
          echo "Render health check failed: $RENDER_HEALTHCHECK_URL"
          exit 1

      - name: Explain skipped deploy hook
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' }}
        run: echo "RENDER_DEPLOY_HOOK_URL is not configured; Render Git integration may deploy this commit instead."
